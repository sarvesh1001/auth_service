
# File: docker-compose.dev.yml

services:
  # ===============================
  # ClickHouse Database
  # ===============================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-dev
    ports:
      - "8123:8123"
      - "9000:9000"
    env_file:
      - .env
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sh:/docker-entrypoint-initdb.d/init-clickhouse.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - dev-net

  # ===============================
  # ScyllaDB (Cassandra-compatible)
  # ===============================
  scylla:
    image: scylladb/scylla:5.2.0
    ports:
      - "9042:9042"
    command: --memory 2G --smp 2 --developer-mode 1
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "until cqlsh -u ${SCYLLA_USERNAME:-cassandra} -p ${SCYLLA_PASSWORD:-cassandra} -e 'describe keyspaces'; do echo waiting for Scylla; sleep 5; done"]
      interval: 15s
      timeout: 60s
      retries: 10
      start_period: 60s
    networks:
      - dev-net

  # ===============================
  # Redis (NON-TLS)
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dev-net

  # ===============================
  # Kafka + Zookeeper
  # ===============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: auth-service-zookeeper-1
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
      - ZOOKEEPER_SYNC_LIMIT=2
      - ZOOKEEPER_4LW_COMMANDS_WHITELIST=ruok,stat,conf,cons
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - dev-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - dev-net

  # ===============================
  # Kafka Topic Initialization
  # ===============================
  kafka-topic-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        chmod +x /scripts/init-kafka-topics.sh
        /scripts/init-kafka-topics.sh
    volumes:
      - ./scripts/init-kafka-topics.sh:/scripts/init-kafka-topics.sh:ro
    environment:
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    networks:
      - dev-net

  # ===============================
  # Elasticsearch + Kibana
  # ===============================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 60s
    networks:
      - dev-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - dev-net

  # ===============================
  # PostgreSQL Database
  # ===============================
  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-auth_service}
      - POSTGRES_USER=${POSTGRES_USER:-auth_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DATABASE:-auth_service}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dev-net

  # ===============================
  # Schema Initialization Service
  # ===============================
  schema-init:
    build:
      context: .
      dockerfile: Dockerfile.schema-init
    container_name: schema-init
    depends_on:
      scylla:
        condition: service_healthy
      clickhouse:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:ro
    restart: "no"
    networks:
      - dev-net

  # ===============================
  # Application Service (HTTP NO TLS)
  # ===============================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - SERVER_ENABLE_TLS=false
      - SERVER_PORT=8080
      - SERVER_TLS_PORT=8443
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - HR_DOCUMENT_BASE_PATH=/data
      - SCYLLA_NODES=scylla:9042
      - SCYLLA_USERNAME=${SCYLLA_USERNAME}
      - SCYLLA_PASSWORD=${SCYLLA_PASSWORD}
      - SCYLLA_KEYSPACE=${SCYLLA_KEYSPACE}
      - KAFKA_BROKERS=kafka:9092
      - AUDIT_OUTBOX_ENABLED=true
      - AUDIT_OUTBOX_TOPIC=audit-logs
      - AUDIT_OUTBOX_BATCH_SIZE=100
      - AUDIT_OUTBOX_POLL_INTERVAL=5s
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - CLICKHOUSE_URL=clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-auth_service}
      - POSTGRES_USER=${POSTGRES_USER:-auth_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_SSLMODE=disable
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - CLICKHOUSE_CA_FILE=
      - TLS_CA_FILE=
      - TLS_CERT_FILE=
      - TLS_KEY_FILE=
    depends_on:
      redis:
        condition: service_healthy
      scylla:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
      kafka-topic-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - auth_documents:/data
    networks:
      - dev-net

# =============================== 
# Volumes & Networks
# ===============================
volumes:
  redis_data:
  scylla_data:
  elasticsearch_data:
  clickhouse_data:
  postgres_data:
  auth_documents:
  

networks:
  dev-net:
    driver: bridge
  default:
    driver: bridge
