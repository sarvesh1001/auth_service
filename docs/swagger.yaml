basePath: /api/v1
definitions:
  handler.AdminAddDepartmentRequest:
    properties:
      department_name:
        type: string
      system_department_id:
        type: string
    type: object
  handler.CreateCompanyRequest:
    properties:
      company_name:
        maxLength: 255
        type: string
      data_region:
        type: string
      departments:
        items:
          type: string
        type: array
      financial_year_start_month:
        maximum: 12
        minimum: 1
        type: integer
      max_departments:
        maximum: 100
        minimum: 1
        type: integer
      max_employees:
        maximum: 2000
        minimum: 1
        type: integer
      owner_full_name:
        maxLength: 255
        type: string
      owner_phone:
        type: string
      owner_position_title:
        maxLength: 255
        type: string
      owner_username:
        maxLength: 100
        minLength: 3
        type: string
      position_work_center_code:
        type: string
      subscription_days:
        maximum: 30
        minimum: 0
        type: integer
      subscription_months:
        maximum: 36
        minimum: 1
        type: integer
      subscription_tier:
        enum:
        - basic
        - premium
        - enterprise
        type: string
      work_center_code:
        maxLength: 100
        type: string
      work_center_description:
        type: string
      work_center_is_active:
        type: boolean
      work_center_name:
        maxLength: 255
        type: string
      work_center_timezone:
        type: string
    required:
    - company_name
    - data_region
    - financial_year_start_month
    - max_departments
    - max_employees
    - owner_full_name
    - owner_phone
    - owner_position_title
    - owner_username
    - subscription_months
    - subscription_tier
    - work_center_code
    - work_center_name
    - work_center_timezone
    type: object
  handler.CreateSubDepartmentRequest:
    properties:
      department_name:
        type: string
    required:
    - department_name
    type: object
  handler.LoginFlowRequest:
    properties:
      data_region:
        type: string
      device_fingerprint:
        type: string
      device_id:
        type: string
      phone_number:
        type: string
    required:
    - data_region
    - device_fingerprint
    - device_id
    - phone_number
    type: object
  handler.MPINChangePhoneRequest:
    properties:
      current_mpin:
        type: string
      device_fingerprint:
        type: string
      device_id:
        type: string
      new_mpin:
        maxLength: 8
        minLength: 4
        type: string
      phone_number:
        type: string
      user_agent:
        type: string
    required:
    - current_mpin
    - device_id
    - new_mpin
    - phone_number
    type: object
  handler.MPINForgotPhoneRequest:
    properties:
      device_fingerprint:
        type: string
      device_id:
        type: string
      phone_number:
        type: string
      user_agent:
        type: string
    required:
    - device_fingerprint
    - device_id
    - phone_number
    type: object
  handler.MPINForgotWithOTPPhoneRequest:
    properties:
      device_fingerprint:
        type: string
      device_id:
        type: string
      new_mpin:
        maxLength: 8
        minLength: 4
        type: string
      otp_code:
        type: string
      phone_number:
        type: string
      user_agent:
        type: string
    required:
    - device_fingerprint
    - device_id
    - new_mpin
    - otp_code
    - phone_number
    type: object
  handler.MPINSetupPhoneRequest:
    properties:
      device_fingerprint:
        type: string
      device_id:
        type: string
      mpin:
        maxLength: 8
        minLength: 4
        type: string
      phone_number:
        type: string
      user_agent:
        type: string
    required:
    - device_fingerprint
    - device_id
    - mpin
    - phone_number
    type: object
  handler.MPINVerifyPhoneRequest:
    properties:
      company_id:
        type: string
      device_fingerprint:
        type: string
      device_id:
        type: string
      mpin:
        type: string
      phone_number:
        type: string
      user_agent:
        type: string
    required:
    - device_fingerprint
    - device_id
    - mpin
    - phone_number
    type: object
  handler.UpdateMaxDepartmentsRequest:
    properties:
      max_departments:
        type: integer
    type: object
  handler.adjustBatchRequest:
    properties:
      delta:
        type: string
      reason:
        type: string
    type: object
  handler.createBatchRequest:
    properties:
      batch_number:
        type: string
      cost_per_unit:
        type: string
      expiry_date:
        type: string
      item_id:
        type: string
      manufactured_date:
        type: string
      quantity:
        type: string
      received_date:
        type: string
      supplier_batch:
        type: string
    type: object
  handler.createEntitlementRequest:
    properties:
      feature_key:
        type: string
      is_enabled:
        type: boolean
      limit_period:
        type: string
      limit_value:
        type: string
      plan_item_id:
        type: string
    type: object
  handler.createProrationPolicyRequest:
    properties:
      downgrade_type:
        type: string
      name:
        type: string
      upgrade_type:
        type: string
    type: object
  handler.grantRequest:
    properties:
      subscription_id:
        type: string
    type: object
  handler.updateDowngradeTypeRequest:
    properties:
      downgrade_type:
        type: string
    type: object
  handler.updateEntitlementRequest:
    properties:
      feature_key:
        type: string
      is_enabled:
        type: boolean
      limit_period:
        type: string
      limit_value:
        type: string
      plan_item_id:
        type: string
    type: object
  handler.updateProrationPolicyRequest:
    properties:
      downgrade_type:
        type: string
      name:
        type: string
      upgrade_type:
        type: string
    type: object
  handler.updateUpgradeTypeRequest:
    properties:
      upgrade_type:
        type: string
    type: object
  models.AdminCreateRequest:
    properties:
      admin_role_id:
        type: string
      data_access_scope:
        items:
          type: string
        type: array
      full_name:
        maxLength: 255
        type: string
      ip_whitelist:
        items:
          type: string
        type: array
      phone_number:
        description: Changed from PhoneHash
        type: string
      reports_to:
        type: string
      role_type:
        enum:
        - 1
        - 2
        - 4
        type: integer
      username:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - admin_role_id
    - full_name
    - phone_number
    - role_type
    - username
    type: object
  models.AdminProfileUpdateRequest:
    properties:
      full_name:
        maxLength: 255
        type: string
      username:
        maxLength: 100
        minLength: 3
        type: string
    type: object
  models.AdminRoleCreateRequest:
    properties:
      department_ids:
        items:
          type: string
        minItems: 1
        type: array
      description:
        type: string
      role_name:
        type: string
      role_type:
        enum:
        - 1
        - 2
        - 4
        type: integer
    required:
    - department_ids
    - role_name
    - role_type
    type: object
  models.AdminRoleUpdateRequest:
    properties:
      add_departments:
        description: Changed from []uuid.UUID to []string
        items:
          type: string
        type: array
      add_permissions:
        items:
          type: string
        type: array
      description:
        type: string
      remove_departments:
        description: Changed from []uuid.UUID to []string
        items:
          type: string
        type: array
      remove_permissions:
        items:
          type: string
        type: array
      replace_permissions:
        items:
          type: string
        type: array
      role_name:
        type: string
    type: object
  models.CompanyEmployeeSearchFilters:
    properties:
      department_id:
        type: string
      hire_date_from:
        type: string
      hire_date_to:
        type: string
      is_active:
        type: boolean
      reports_to:
        type: string
      role_id:
        type: string
    type: object
  models.CompanyEmployeeSearchRequest:
    properties:
      company_id:
        type: string
      filters:
        $ref: '#/definitions/models.CompanyEmployeeSearchFilters'
      limit:
        type: integer
      offset:
        type: integer
      query:
        type: string
      search_type:
        description: '"fulltext" or "autocomplete"'
        type: string
    type: object
  models.DepartmentPermission:
    properties:
      department_name:
        type: string
      permissions:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - department_name
    - permissions
    type: object
  models.EmployeeRoleCreateRequest:
    properties:
      department_permissions:
        items:
          $ref: '#/definitions/models.DepartmentPermission'
        minItems: 1
        type: array
      description:
        type: string
      role_name:
        type: string
    required:
    - department_permissions
    - role_name
    type: object
  models.ManagerRoleCreateRequest:
    properties:
      department_names:
        items:
          type: string
        minItems: 1
        type: array
      description:
        type: string
      role_name:
        type: string
    required:
    - department_names
    - role_name
    type: object
  models.PairingRequest:
    properties:
      session_id:
        type: string
      signature:
        type: string
    required:
    - session_id
    - signature
    type: object
  service.BindDeviceRequest:
    properties:
      device_id:
        type: string
      ip_address:
        type: string
      user_agent:
        type: string
      user_id:
        type: string
    required:
    - device_id
    - user_id
    type: object
  service.CreatePositionRequest:
    properties:
      attendance_required:
        type: boolean
      company_id:
        type: string
      department_id:
        type: string
      is_open:
        type: boolean
      is_schedulable:
        type: boolean
      overtime_allowed:
        type: boolean
      title:
        type: string
      work_center_code:
        type: string
    type: object
  service.OTPSendRequest:
    properties:
      device_fingerprint:
        type: string
      device_id:
        type: string
      ip_address:
        type: string
      phone_number:
        maxLength: 15
        minLength: 10
        type: string
      provider:
        type: string
      purpose:
        enum:
        - login
        - verification
        - password_reset
        - admin_login
        - forgot_mpin
        type: string
      user_agent:
        type: string
    required:
    - phone_number
    - purpose
    type: object
  service.OTPVerifyRequest:
    properties:
      device_fingerprint:
        type: string
      device_id:
        type: string
      ip_address:
        type: string
      otp:
        type: string
      phone_number:
        maxLength: 15
        minLength: 10
        type: string
      purpose:
        enum:
        - login
        - verification
        - password_reset
        - admin_login
        - forgot_mpin
        type: string
      user_agent:
        type: string
    required:
    - otp
    - phone_number
    - purpose
    type: object
  service.UpdateDepartmentParentRequest:
    properties:
      department_id:
        type: string
      parent_department_id:
        type: string
    required:
    - department_id
    type: object
  service.UpdatePositionRequest:
    properties:
      attendance_required:
        type: boolean
      department_id:
        type: string
      is_open:
        type: boolean
      is_schedulable:
        type: boolean
      overtime_allowed:
        type: boolean
      position_id:
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
      work_center_code:
        maxLength: 100
        type: string
    required:
    - department_id
    - position_id
    - title
    type: object
  service.UserUpdateRequest:
    properties:
      data_region:
        enum:
        - us
        - eu
        - as
        type: string
      device_fingerprint:
        type: string
      device_id:
        type: string
      full_name:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      is_verified:
        type: boolean
      kyc_level:
        enum:
        - basic
        - advanced
        - full
        type: string
      kyc_status:
        enum:
        - pending
        - verified
        - rejected
        - under_review
        - expired
        type: string
      username:
        maxLength: 100
        minLength: 3
        type: string
    type: object
  service.ValidateDeviceRequest:
    properties:
      bind_token:
        type: string
      device_id:
        type: string
      ip_address:
        type: string
      user_id:
        type: string
    required:
    - bind_token
    - device_id
    - user_id
    type: object
host: localhost:8080
info:
  contact: {}
  description: Auth Service for B2B Suite – admin, employee, attendance, etc.
  title: B2B Suite API
  version: "1.0"
paths:
  /api/v1/admin-auth/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Service healthy
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service unhealthy
          schema:
            additionalProperties: true
            type: object
      summary: Admin health check
      tags:
      - admin-health
  /api/v1/admin-auth/login/initiate:
    post:
      consumes:
      - application/json
      description: Determines the login flow based on admin existence, MPIN status,
        and device trust.
      parameters:
      - description: Login initiation request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Login flow determined
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
      summary: Initiate admin login
      tags:
      - admin-auth
  /api/v1/admin-auth/login/verify-mpin:
    post:
      consumes:
      - application/json
      description: Authenticates admin using MPIN and issues JWT tokens.
      parameters:
      - description: MPIN login request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Login successful, returns tokens and admin data
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: MPIN verification failed
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Admin not found
          schema:
            additionalProperties: true
            type: object
      summary: Verify admin MPIN login
      tags:
      - admin-auth
  /api/v1/admin-auth/login/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies OTP for admin login and binds the device.
      parameters:
      - description: OTP verification request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified, device trusted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication failed
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Rate limit or quota exceeded
          schema:
            additionalProperties: true
            type: object
      summary: Verify admin OTP login
      tags:
      - admin-auth
  /api/v1/admin-auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Logout admin
      tags:
      - admin-auth
  /api/v1/admin-auth/mpin/change:
    post:
      consumes:
      - application/json
      description: Updates MPIN after verifying current MPIN.
      parameters:
      - description: MPIN change request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: MPIN changed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Change admin MPIN
      tags:
      - admin-auth
  /api/v1/admin-auth/mpin/forgot:
    post:
      consumes:
      - application/json
      description: Sends OTP to admin's phone for MPIN reset.
      parameters:
      - description: Forgot MPIN request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Forgot MPIN initiated
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Phone not registered
          schema:
            additionalProperties: true
            type: object
      summary: Forgot admin MPIN
      tags:
      - admin-auth
  /api/v1/admin-auth/mpin/forgot/verify:
    post:
      consumes:
      - application/json
      description: Verifies OTP and sets a new MPIN.
      parameters:
      - description: Reset MPIN request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: MPIN reset successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Phone not registered
          schema:
            additionalProperties: true
            type: object
      summary: Verify forgot admin MPIN
      tags:
      - admin-auth
  /api/v1/admin-auth/mpin/setup:
    post:
      consumes:
      - application/json
      description: Creates an MPIN for the admin after successful OTP verification.
      parameters:
      - description: MPIN setup request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: MPIN setup successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Setup admin MPIN
      tags:
      - admin-auth
  /api/v1/admin-auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: New token pair
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid refresh token
          schema:
            additionalProperties: true
            type: object
      summary: Refresh admin tokens
      tags:
      - admin-auth
  /api/v1/admin/admins:
    get:
      parameters:
      - description: Search query
        in: query
        name: query
        type: string
      - description: Filter by role type
        in: query
        name: role_type
        type: integer
      - description: Include inactive admins
        in: query
        name: include_inactive
        type: boolean
      - default: 50
        description: Page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Admins with metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Permission denied
          schema:
            additionalProperties: true
            type: object
      summary: List admins
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AdminCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Admin created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Permission denied
          schema:
            additionalProperties: true
            type: object
      summary: Create admin user
      tags:
      - admin-users
  /api/v1/admin/admins/{adminID}:
    delete:
      parameters:
      - description: Admin UUID
        in: path
        name: adminID
        required: true
        type: string
      responses:
        "200":
          description: Admin deleted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid admin ID
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Permission denied
          schema:
            additionalProperties: true
            type: object
      summary: Delete admin user
      tags:
      - admin-users
    get:
      parameters:
      - description: Admin UUID
        in: path
        name: adminID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Admin details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid admin ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Admin not found
          schema:
            additionalProperties: true
            type: object
      summary: Get admin user
      tags:
      - admin-users
    put:
      consumes:
      - application/json
      parameters:
      - description: Admin UUID
        in: path
        name: adminID
        required: true
        type: string
      - description: Update fields
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Admin updated
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Permission denied
          schema:
            additionalProperties: true
            type: object
      summary: Update admin user
      tags:
      - admin-users
  /api/v1/admin/admins/{adminID}/activate:
    post:
      parameters:
      - description: Admin UUID
        in: path
        name: adminID
        required: true
        type: string
      responses:
        "200":
          description: Admin activated
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid admin ID
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Permission denied
          schema:
            additionalProperties: true
            type: object
      summary: Activate admin
      tags:
      - admin-users
  /api/v1/admin/admins/{adminID}/avatar:
    delete:
      parameters:
      - description: Admin UUID
        in: path
        name: adminID
        required: true
        type: string
      responses:
        "200":
          description: Avatar removed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid admin ID
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Permission denied
          schema:
